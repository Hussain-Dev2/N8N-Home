services:
  n8n:
    container_name: n8n
    build:
      context: .
      dockerfile: Dockerfile
    # NOTE: Do NOT add an `image:` field here — it overrides build: and prevents
    # Dockerfile from being used. Remove image: if you see it.
    # All environment variables (secrets and non-secrets) live in .env so it is
    # the single source of truth. Create .env locally and never commit it.
    env_file:
      - .env
    # N8N_PORT is intentionally omitted here.
    # start-n8n.sh sets it from Render's $PORT at runtime, falling back to 5678.
    # Setting it here would prevent that override from working.
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./shared:/data/shared
    restart: unless-stopped
    # Healthcheck uses the default local n8n port. On Render the container runs
    # on $PORT assigned at runtime, but this compose file is for local use so
    # 5678 is the correct port to check.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Prevent Docker Desktop / VPN DNS flakiness from causing DB init failures.
    # If your network blocks public DNS, remove this and rely on your host resolver.
    dns:
      - 8.8.8.8
      - 1.1.1.1

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --url http://n8n:5678
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_data: